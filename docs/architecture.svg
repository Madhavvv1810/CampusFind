<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Arial, Helvetica, sans-serif">
  <title>CampusFind AWS architecture</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#4b5a52"/></marker>
    <style>
      .box{fill:#fff;stroke:#a8bbae;stroke-width:1.5}
      .aws{fill:#eef4ec;stroke:#205a45;stroke-width:1.5}
      .t{font-size:14px;font-weight:700;fill:#1d2a25}
      .s{font-size:11px;fill:#5d6b63}
      .l{font-size:10.5px;fill:#4b5a52}
      .e{stroke:#4b5a52;stroke-width:1.5;fill:none;marker-end:url(#a)}
      .d{stroke:#4b5a52;stroke-width:1.5;fill:none;stroke-dasharray:5 4;marker-end:url(#a)}
    </style>
  </defs>
  <rect x="190" y="12" width="698" height="396" rx="14" fill="#f6f9f4" stroke="#cfdccf" stroke-width="1.5"/>
  <text x="206" y="400" class="s" font-weight="700" fill="#205a45">AWS Cloud · us-east-1 · deployed with AWS SAM / CloudFormation</text>

  <!-- Browser -->
  <rect x="14" y="160" width="150" height="88" rx="10" class="box"/>
  <text x="89" y="196" text-anchor="middle" class="t">Student browser</text>
  <text x="89" y="214" text-anchor="middle" class="s">HTML · JS · fingerprint</text>
  <text x="89" y="230" text-anchor="middle" class="s">Cognito ID token</text>

  <!-- Web bucket -->
  <rect x="220" y="52" width="170" height="62" rx="10" class="aws"/>
  <text x="305" y="78" text-anchor="middle" class="t">CloudFront (HTTPS)</text>
  <text x="305" y="96" text-anchor="middle" class="s">→ S3 website origin</text>

  <!-- API Gateway -->
  <rect x="220" y="173" width="170" height="62" rx="10" class="aws"/>
  <text x="305" y="199" text-anchor="middle" class="t">API Gateway</text>
  <text x="305" y="217" text-anchor="middle" class="s">HTTP API · JWT authorizer</text>

  <!-- Photo bucket -->
  <rect x="220" y="320" width="170" height="62" rx="10" class="aws"/>
  <text x="305" y="346" text-anchor="middle" class="t">S3 photo bucket</text>
  <text x="305" y="364" text-anchor="middle" class="s">private · encrypted</text>

  <!-- API Lambda -->
  <rect x="450" y="173" width="170" height="62" rx="10" class="aws"/>
  <text x="535" y="199" text-anchor="middle" class="t">API Lambda</text>
  <text x="535" y="217" text-anchor="middle" class="s">posts · matches · chat</text>

  <!-- DynamoDB -->
  <rect x="690" y="52" width="180" height="78" rx="10" class="aws"/>
  <text x="780" y="78" text-anchor="middle" class="t">DynamoDB</text>
  <text x="780" y="96" text-anchor="middle" class="s">Items table · 3 GSIs</text>
  <text x="780" y="112" text-anchor="middle" class="s">Claims (chats) · 2 GSIs</text>

  <!-- Worker -->
  <rect x="450" y="320" width="170" height="62" rx="10" class="aws"/>
  <text x="535" y="346" text-anchor="middle" class="t">Image-worker Lambda</text>
  <text x="535" y="364" text-anchor="middle" class="s">async · auto-retry</text>

  <!-- Rekognition -->
  <rect x="690" y="320" width="180" height="62" rx="10" class="aws"/>
  <text x="780" y="346" text-anchor="middle" class="t">Rekognition</text>
  <text x="780" y="364" text-anchor="middle" class="s">DetectLabels (optional)</text>

  <!-- Cognito -->
  <rect x="450" y="52" width="170" height="62" rx="10" class="aws"/>
  <text x="535" y="78" text-anchor="middle" class="t">Cognito user pool</text>
  <text x="535" y="96" text-anchor="middle" class="s">sign-in · @thapar.edu only</text>

  <!-- CloudWatch -->
  <rect x="690" y="186" width="180" height="40" rx="10" class="aws"/>
  <text x="780" y="211" text-anchor="middle" class="t">CloudWatch</text>

  <!-- edges -->
  <path d="M120,160 L120,36 L535,36 L535,50" class="e"/><text x="200" y="30" class="l">1 sign in (hosted UI, PKCE)</text>
  <path d="M164,180 L218,90" class="e"/><text x="126" y="140" class="l">2 load site</text>
  <path d="M164,204 L218,204" class="e"/><text x="168" y="198" class="l">3 REST</text>
  <path d="M335,173 L462,116" class="d"/><text x="392" y="160" class="l">verify JWT</text>
  <path d="M164,232 L218,345" class="e"/><text x="22" y="292" class="l">4 upload / view</text>
  <text x="22" y="305" class="l">(presigned URL)</text>
  <path d="M390,204 L448,204" class="e"/>
  <path d="M620,192 L688,108" class="e"/><text x="588" y="126" class="l">read / write</text>
  <path d="M535,235 L535,318" class="d"/><text x="542" y="282" class="l">5 async invoke</text>
  <path d="M450,222 C420,270 410,300 390,330" class="d"/><text x="456" y="262" class="l">HeadObject,</text><text x="456" y="274" class="l">sign URLs</text>
  <path d="M450,350 L392,350" class="e"/><text x="402" y="344" class="l">read</text>
  <path d="M620,351 L688,351" class="e"/><text x="628" y="344" class="l">labels</text>
  <path d="M608,320 L704,132" class="e"/><text x="630" y="300" class="l">6 status, labels</text>
  <path d="M620,214 L688,207" class="d"/>
</svg>
